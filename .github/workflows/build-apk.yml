name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Flutter project
        id: project
        run: |
          if [ -f pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.project.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.project.outputs.exists == 'true'
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        if: steps.project.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.project.outputs.exists == 'true'
        run: flutter analyze

      - name: Test
        if: steps.project.outputs.exists == 'true'
        run: flutter test

      - name: Build debug APK
        if: steps.project.outputs.exists == 'true'
        run: flutter build apk --debug

      - name: Publish APK to a release
        if: steps.project.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-debug.apk
